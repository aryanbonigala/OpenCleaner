[package]
name = "opencleaner_ai"
version = "0.1.0"
description = "OpenCleaner AI"
authors = ["OpenCleaner Contributors"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.6", features = [ "shell-open" ] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
